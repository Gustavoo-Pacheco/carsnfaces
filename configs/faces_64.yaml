# Main model: autoencoder trained from scratch on real faces (CelebA), 64px.
name: faces_64
train_dir: ${CNF_DATA}/raw/celeba
probe_dir: ${CNF_DATA}/processed/car_fronts_64
image_size: 64
grayscale: true
augment: true
base_channels: 64
latent_dim: 256
batch_size: 128
lr: 0.0002
loss: l1
max_steps: 30000
run_dir: ${CNF_RUNS}/faces_64
wandb_project: carsnfaces
tags: [faces, main, 64px]
