# Pipeline check (BASELINE.md §7 step 1): tiny model, 200 steps, a few minutes on any GPU. No W&B.
name: smoke_test
data_dir: ${CNF_DATA}/processed
max_train_images: 20000
channels: [32, 32, 64, 64]
res_blocks_per_stage: 1
gn_groups: 8
latent_dim: 32
batch_size: 64
lr_warmup_steps: 20
kl_warmup_steps: 50
max_steps: 200
log_every: 20
eval_every: 100
ckpt_every: 50
milestone_epochs: []
run_dir: ${CNF_RUNS}/smoke_test
wandb_mode: disabled
